<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        /* 2. %단위 작성하기
        주의>> 순서 바꾼 이유: nth-child()는 ,p>만 세는 게 아니라,
        같은 부모 아래의 모든 형제 요소를 세기 때문 
         p:nth-child(1) {font-size: 100%;}
        p:nth-child(2) {font-size: 150%;}
        p:nth-child(3) {font-size: 200%;}
        
        3. em단위 적용하기: 배수를 나타내는 단위.
                       1배=1em=100%
                       1.5배=1.5em=150%
                       
        4. px단위 적용하기: px단위는 크기를 절대적으로 지정함.
             p태그의 기본 font-size속성이 16px이므로 실행할 때 참고*/

        /*%단위*/
        p:nth-child(1) {font-size: 100%;}
        p:nth-child(2) {font-size: 150%;}
        p:nth-child(3) {font-size: 200%;}
        /*em단위*/
        p:nth-child(1) {font-size: 1em;}
        p:nth-child(2) {font-size: 1.5em;}
        p:nth-child(3) {font-size: 2em;}
        /*px단위*/
        p:nth-child(1) {font-size: 16px;}
        p:nth-child(2) {font-size: 24px;}
        p:nth-child(3) {font-size: 32px;}
        /*색상단위*/
        h1 {backgorund-color:rgb(255,255,0);} /* RGB색상*/
        h2 {background-color: rgb(173, 255, 47,0.5);} /*RGBA색상: 알파값은 투명도, 0완전투명, 1.0완전 불투명 상태*/
        h3 {background-color:rgb(#0094ff);} /*HEX코드: RGB색상 단위를 짧게 입력하는 방법, RGB색상조합을 16진수로 입력*/


    </style>

    <title>3. CSS3 단위</title>
</head>
<body>
    <h1>6. CSS3 단위</h1>
    <h2>6.1 키워드 단위 : W3C에서 미리 정의한 단어</h2>
    <h3>6.2 크기 단위</h3>
    <h4>6.3 색상 단위</h4>

    <hr>
    <h4>10CSS3Unit_basic</h4>
    <h4>10CSS3Unit_percent</h4>

    <p>우와와우와우와와타쿠타쿠챠오</p>
    <p>우와와우와우와와타쿠타쿠챠오</p>
    <p>우와와우와우와와타쿠타쿠챠오</p>
    <p>우와와우와우와와타쿠타쿠챠오</p>
</body>
</html>
