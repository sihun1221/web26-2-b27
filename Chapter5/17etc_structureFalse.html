<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3. 구조선택자</title>
 /* 모든 a태그에 빨간색이 적용?
    => li태그의 첫번째 자손에 해당하는 a태그를 선택했으므로, a태그 5개가 전부 이 조건에 해당됨 */
    <Style>
        li > a:first-child > a {color: yellow;}
    </Style>
</head>
<body>
    <ul>
        <li><a href="#">우사기</a></li>
        <li><a href="#">우사기</a></li>
        <li><a href="#">우사기</a></li>
        <li><a href="#">우사기</a></li>
        <li><a href="#">우사기</a></li>

    </ul>
</body>
</html>
