<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        ul {overflow: hidden;}
        li {
            list-style: none;
            float: left; padding: 15px;
        }
        li:first-child {border-radius: 10px 0 0 10px;}
        li:last-child {border-radius: 0 10px 10px 0;}

        li:nth-child(2n) {background-color: green;}
        li:nth-child(2n+1) {background-color: greenyellow;}
        </style>
</head>
<body>
    <h1>구조 선택자</h1>
    <ui>
        <li>우사기</li>
        <li>하치와레</li>
        <li>치이카와</li>
        <li>랏코</li>
        <li>쿠리만쥬</li>
        <li>시사</li>
    </ui>
</body>
</html>
