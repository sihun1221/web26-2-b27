<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>14etc_action</title>
    <style>
        h1:hover { color: green;}
        h2:action { color: greenyellow;}

        input:enabled { background-color: white;}
        input:disabled { background-color: green;}
        input:focus { background-color: greenyellow; }
    </style>
    <!--focus 부분은 사용 가능 부분을 클릭하였을 때 나타나는 색. 즉, focus를 맞췄을 때라고 생각하면 됨! enabled는 클릭하지 않았을 때 표시되는 색-->
</head>
<body>
    <h2>5.1 반응 선택자</h2>
    <h2>5.2 상태 선택자</h2>

    <hr>
    <h1>반응 선택자</h1>

    <h2> 사용 가능 </h2>
    <input>
    <h2> 사용 불가능 </h2>
    <input disabled="disabled">

</body>
</html>
